<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Beräknad ankomst</title>
<!--
  Lastbil: delad ankomsttid (F-081). Statisk sida för GitHub Pages (asgeir86/lastbil-data, mappen eta/).
  Länken ser ut så här: https://asgeir86.github.io/lastbil-data/eta/#<nyckel>
  Nyckeln står efter # och skickas därför aldrig till GitHub. Sidan frågar Supabase-funktionen
  get_shared_eta (backend/supabase/006_delad_ankomst.sql) med den publika nyckeln, som också ligger i
  appen. Den visar bara mål, beräknad ankomst och när tiden uppdaterades, aldrig position.
-->
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #16202a; --muted: #5b6875; --accent: #b77b00; --line: #dde2e7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f161d; --panel: #17212b; --text: #eef2f5; --muted: #9eb0bf; --accent: #f0b429; --line: #26333f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; }
  .label { color: var(--muted); font-size: 15px; margin: 0 0 4px; }
  .dest { font-size: 22px; font-weight: 650; margin: 0 0 18px; overflow-wrap: anywhere; }
  .eta { font-size: 56px; font-weight: 750; letter-spacing: -1px; margin: 0; font-variant-numeric: tabular-nums; }
  .day { font-size: 18px; color: var(--accent); font-weight: 600; margin: 2px 0 0; min-height: 1em; }
  .meta { color: var(--muted); font-size: 15px; margin: 18px 0 0; }
  .note { color: var(--muted); font-size: 14px; margin: 18px 4px 0; }
  .state { font-size: 19px; font-weight: 600; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card" id="card" aria-live="polite">
    <p class="state" id="state">Hämtar …</p>
  </div>
  <p class="note">
    Beräknad ankomst från appen Lastbil, med lastbilens fart, raster och färjor. Tiden är en beräkning,
    inget löfte. Ingen position delas. Länken slutar gälla när föraren är framme, stänger av delningen
    eller efter 24 timmar.
  </p>
</main>
<script>
  // Samma projekt och publika nyckel (publishable) som appen. Nyckeln är gjord för att vara publik;
  // databasens regler släpper bara igenom get_shared_eta.
  const SUPABASE_URL = "https://wnnxwyxfjijajjtyiier.supabase.co";
  const PUBLIC_KEY = "sb_publishable_y-pDB0hXw-uBrmSr1Tz9RA_y3cRFOUv";
  const REFRESH_MS = 60 * 1000;

  const card = document.getElementById("card");
  const token = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();

  function clock(date) {
    return date.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Stockholm" });
  }

  function dayText(date) {
    const fmt = (d) => d.toLocaleDateString("sv-SE", { timeZone: "Europe/Stockholm" });
    const today = new Date();
    const tomorrow = new Date(today.getTime() + 24 * 3600 * 1000);
    if (fmt(date) === fmt(today)) return "";
    if (fmt(date) === fmt(tomorrow)) return "i morgon";
    return date.toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Stockholm" });
  }

  function showMessage(text) {
    card.replaceChildren();
    const p = document.createElement("p");
    p.className = "state";
    p.textContent = text;
    card.appendChild(p);
  }

  function element(tag, cls, text) {
    const e = document.createElement(tag);
    e.className = cls;
    e.textContent = text;
    return e;
  }

  function show(row) {
    card.replaceChildren();
    card.appendChild(element("p", "label", "Till"));
    card.appendChild(element("p", "dest", row.destination_name || "målet"));
    const updated = row.updated_at ? new Date(row.updated_at) : null;
    if (row.ended) {
      card.appendChild(element("p", "state", "Delningen är avslutad."));
      if (updated) card.appendChild(element("p", "meta", "Senast uppdaterad " + clock(updated)));
      return false;
    }
    const eta = new Date(row.eta);
    card.appendChild(element("p", "label", "Beräknad ankomst"));
    card.appendChild(element("p", "eta", clock(eta)));
    card.appendChild(element("p", "day", dayText(eta)));
    if (updated) {
      const minutes = Math.round((Date.now() - updated.getTime()) / 60000);
      let text = "Uppdaterad " + clock(updated);
      if (minutes >= 15) text += " (för " + minutes + " min sedan, appen kan sakna täckning)";
      card.appendChild(element("p", "meta", text));
    }
    return true;
  }

  async function load() {
    if (!/^[A-Za-z0-9_-]{32,100}$/.test(token)) {
      showMessage("Länken är ofullständig. Be föraren skicka den igen.");
      return false;
    }
    try {
      const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_shared_eta", {
        method: "POST",
        headers: { "apikey": PUBLIC_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_token: token }),
        cache: "no-store",
        referrerPolicy: "no-referrer",
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const rows = await response.json();
      if (!Array.isArray(rows) || rows.length === 0) {
        showMessage("Delningen finns inte eller har gått ut.");
        return false;
      }
      return show(rows[0]);
    } catch (e) {
      if (!card.querySelector(".eta")) showMessage("Kunde inte hämta ankomsttiden. Försöker igen …");
      return true;
    }
  }

  let timer = null;
  async function tick() {
    const again = await load();
    if (again) timer = setTimeout(tick, REFRESH_MS);
  }
  window.addEventListener("hashchange", () => location.reload());
  tick();
</script>
</body>
</html>
